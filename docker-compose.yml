services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omniserve-backend
    ports:
      - "5000:5000"
    volumes:
      - ./server/src:/app/src
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=development
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: omniserve-frontend
    ports:
      - "5173:80"
    env_file:
      - path: ./client/.env
        required: false
    depends_on:
      - server
    restart: unless-stopped

  order-simulator:
    build:
      context: ./order-simulator
      dockerfile: Dockerfile
    container_name: omniserve-order-simulator
    ports:
      - "5050:5050"
    volumes:
      - ./order-simulator/src:/app/src
      - ./order-simulator/public:/app/public
    env_file:
      - path: ./order-simulator/.env
        required: false
    environment:
      - PORT=5050
      - OMNISERVE_API_URL=http://server:5000/api
    depends_on:
      - server
    restart: unless-stopped
